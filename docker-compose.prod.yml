services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: always
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: always
    networks:
      - medusa_network
  medusa-backend:
    build:
      context: ./medusa-backend
      dockerfile: Dockerfile.prod
    container_name: medusa_backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/medusa-store
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - medusa_static:/server/static
    networks:
      - medusa_network
  nuxt-storefront:
    build:
      context: ./nuxt-storefront
      dockerfile: Dockerfile.prod
      args:
        NUXT_PUBLIC_MEDUSA_BACKEND_URL: ${NUXT_PUBLIC_MEDUSA_BACKEND_URL}
        NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NUXT_PUBLIC_STRIPE_KEY: ${NUXT_PUBLIC_STRIPE_KEY}
    container_name: nuxt_storefront
    restart: always
    depends_on:
      - medusa-backend
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_MEDUSA_BACKEND_URL: ${NUXT_PUBLIC_MEDUSA_BACKEND_URL}
      NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NUXT_PUBLIC_STRIPE_KEY: ${NUXT_PUBLIC_STRIPE_KEY}
    networks:
      - medusa_network
  nuxt-storefront-2:
    build:
      context: ./nuxt-storefront-2
      dockerfile: Dockerfile.prod
      args:
        NUXT_PUBLIC_MEDUSA_BACKEND_URL: ${NUXT_PUBLIC_MEDUSA_BACKEND_URL}
        NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NUXT_PUBLIC_STRIPE_KEY: ${NUXT_PUBLIC_STRIPE_KEY}
    container_name: nuxt_storefront_2
    restart: always
    depends_on:
      - medusa-backend
    ports:
      - "3001:3000"
    environment:
      NUXT_PUBLIC_MEDUSA_BACKEND_URL: ${NUXT_PUBLIC_MEDUSA_BACKEND_URL}
      NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NUXT_PUBLIC_STRIPE_KEY: ${NUXT_PUBLIC_STRIPE_KEY}
    networks:
      - medusa_network
volumes:
  postgres_data:
  medusa_static:
networks:
  medusa_network:
    driver: bridge
